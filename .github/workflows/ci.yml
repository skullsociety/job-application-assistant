name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm install
      - run: npm test
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover --start-directory shared_tracker --verbose
      - run: python -m unittest discover --start-directory tests --verbose
        working-directory: linkedin
        env:
          PYTHONPATH: ..
      - run: python -m unittest discover --start-directory tests --verbose
        working-directory: jobstreet
        env:
          PYTHONPATH: ..
      - run: python -m unittest discover --start-directory companion --verbose
        working-directory: careersgov
        env:
          PYTHONPATH: ..
